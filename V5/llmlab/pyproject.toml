[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmlab"
version = "1.2.0"
description = "Seven exercises that check claims from the EU GREEN session 'AI in Teaching' against a model running on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "EduGreenLabs / OvGU Magdeburg — WP2 Training Lab" }]
keywords = ["education", "local-llm", "ollama", "oer", "teacher-development"]
dependencies = []

[project.scripts]
llmlab = "llmlab.cli:main"

[tool.setuptools]
packages = ["llmlab"]

[tool.setuptools.package-data]
llmlab = ["ui/*.html"]
