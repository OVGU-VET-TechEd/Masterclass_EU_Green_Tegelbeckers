[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmlab"
version = "2.0.0"
description = "Seven exercises on the behaviour of language models, run against a model on your own computer. EU GREEN session 'AI in Teaching'."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "EduGreenLabs / OvGU Magdeburg — WP2 Training Lab" }]
keywords = ["education", "local-llm", "ollama", "oer", "teacher-development"]
dependencies = []

[project.scripts]
llmlab = "llmlab.cli:main"

[tool.setuptools]
packages = ["llmlab"]

[tool.setuptools.package-data]
llmlab = [
  "ui/*.html",
  "tasks/*/*.md",
  "tasks/*/*.json",
  "tasks/*/context/*.md",
  "tasks/*/inputs/*.txt",
]
